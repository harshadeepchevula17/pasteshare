spring.application.name=pasteshare-api

server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

pasteshare.public-base-url=${PASTESHARE_PUBLIC_BASE_URL}
pasteshare.allowed-origin=${PASTESHARE_ALLOWED_ORIGIN}
pasteshare.max-content-length=${PASTESHARE_MAX_CONTENT_LENGTH:100000}
pasteshare.id-generation-attempts=${PASTESHARE_ID_GENERATION_ATTEMPTS:5}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.probes.enabled=true
